server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: oficinadata-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: oficina
        format_sql: true
    open-in-view: false

app:
  jwt:
    issuer: OficinaData
    secret: ${JWT_SECRET:dev-secret-change-me-dev-secret-change-me-dev-secret}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    refresh-expiration-minutes: ${JWT_REFRESH_EXPIRATION_MINUTES:240}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
