server:
  port: 8080

spring:
  application:
    name: oficinadata-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oficina_db?currentSchema=oficina}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      connection-init-sql: SET search_path TO oficina, public
  jackson:
    time-zone: America/Fortaleza

app:
  jwt:
    secret: ${JWT_SECRET:troque-este-segredo-em-producao-com-pelo-menos-32-caracteres}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
